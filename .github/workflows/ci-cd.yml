name: Build & Push Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Замените на ваш GitHub username/org
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ────────────────────────────────────────────────
  # Шаг 1: тесты основного сервиса
  # ────────────────────────────────────────────────
  test-main-service:
    name: Test satellite-spring
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satellite-spring
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-main
          path: satellite-spring/build/reports/tests/

  # ────────────────────────────────────────────────
  # Шаг 2: тесты планировщика
  # ────────────────────────────────────────────────
  test-scheduler:
    name: Test satellite-scheduler
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satellite-scheduler
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

  # ────────────────────────────────────────────────
  # Шаг 3: SAST — статический анализ кода
  # ────────────────────────────────────────────────
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    needs: [test-main-service, test-scheduler]
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build for CodeQL
        run: |
          cd satellite-spring && ./gradlew compileJava --no-daemon
          cd ../satellite-scheduler && ./gradlew compileJava --no-daemon
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ────────────────────────────────────────────────
  # Шаг 4: Docker build + push (только на main)
  # ────────────────────────────────────────────────
  docker-build-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    needs: [sast]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN создаётся автоматически — в Secrets добавлять не нужно
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag (short commit SHA)
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build & push satellite-spring
        uses: docker/build-push-action@v5
        with:
          context: ./satellite-spring
          push: true
          # Тегируем и latest, и конкретным SHA — легко откатиться
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/satellite-spring:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/satellite-spring:${{ steps.meta.outputs.tag }}

      - name: Build & push satellite-scheduler
        uses: docker/build-push-action@v5
        with:
          context: ./satellite-scheduler
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/satellite-scheduler:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/satellite-scheduler:${{ steps.meta.outputs.tag }}

  # ────────────────────────────────────────────────
  # Шаг 5: DAST — сканирование образов на уязвимости
  # (Trivy — популярный open-source сканер от Aqua Security)
  # ────────────────────────────────────────────────
  dast-image-scan:
    name: DAST — Trivy image scan
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    steps:
      - name: Scan satellite-spring image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: >-
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/satellite-spring:latest
          format: table
          exit-code: '0'        # не падаем на HIGH, только сообщаем
          severity: CRITICAL,HIGH

      - name: Scan satellite-scheduler image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: >-
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/satellite-scheduler:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
