spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        # H2 не поддерживает PostgreSQL-специфичные типы —
        # используем совместимый режим
        globally_quoted_identifiers: false

  flyway:
    enabled: false

telemetry:
  client:
    enabled: false   # не поднимаем gRPC-соединение в тестах

# Kafka — в тестах используем встроенный EmbeddedKafka (@EmbeddedKafkaBroker)
# через @EmbeddedKafka на конкретном тесте, или просто выключаем auto-config
# чтобы не пытался подключиться к localhost:9094, которого нет.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
