server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: satellite-management-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/satellite_db}
    username: ${SPRING_DATASOURCE_USERNAME:satellite_user}
    password: ${SPRING_DATASOURCE_PASSWORD:1}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer:   org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Не добавляем заголовок с Java-классом — консьюмеры из других пакетов
        # десериализуют в свои локальные record'ы без настройки type-mapping
        spring.json.add.type.headers: "false"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

grpc:
  server:
    # Порт gRPC-сервера телеметрии (telemetry.TelemetryApplication).
    # Должен совпадать с TELEMETRY_GRPC_PORT клиента ниже (по умолчанию 9091),
    # иначе клиент будет получать UNAVAILABLE, даже когда сервер запущен —
    # без этой настройки grpc-server-spring-boot-starter слушает 9090.
    port: ${GRPC_PORT:9091}
  client:
    telemetry-service:
      address: "static://${TELEMETRY_SERVICE_HOST:localhost}:${TELEMETRY_GRPC_PORT:9091}"
      negotiation-type: plaintext

telemetry:
  client:
    enabled: true

app:
  space-center-service:
    # URL основного REST API (seminars.Main), к которому scheduler.SpaceOperationClient
    # ходит через RestClient. Раньше эта секция вообще отсутствовала — RestClient.builder()
    # получал baseUrl(null) и SchedulerApplication падал с NullPointerException при старте.
    url: ${SERVER_URL:http://localhost:8080}
    # Список запланированных миссий пуст по умолчанию — при необходимости переопределите
    # в application.yaml или через переменные окружения. Пустой список не является ошибкой:
    # ConfiguredMissionScheduler просто ничего не регистрирует и логирует предупреждение.
    missions: []
